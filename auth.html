<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080810">
  <title>Sign In — MusicsAura</title>
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="page-scroll">
<div class="auth-page">
  <div class="auth-card">
    <img src="assets/logo.png" alt="MusicsAura" class="auth-logo">
    <h1>MusicsAura</h1>
    <p class="tagline">Your personal Indian music streaming experience.</p>

    <div class="alert-box alert-error" id="auth-error"></div>
    <div class="alert-box alert-success" id="auth-success"></div>

    <!-- GOOGLE SIGN IN -->
    <button class="btn-google" id="btn-google">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="none" d="M0 0h48v48H0z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider">or with email</div>

    <!-- EMAIL / PASSWORD FORM -->
    <form id="auth-form" onsubmit="return false;">
      <div class="input-group">
        <input class="form-input" type="email" id="email" placeholder="Email address" autocomplete="email" required>
      </div>
      <div class="input-group">
        <input class="form-input" type="password" id="password" placeholder="Password (min 6 characters)" autocomplete="current-password" required>
      </div>

      <div style="display:flex;justify-content:flex-end;margin-bottom:1rem">
        <button type="button" id="btn-forgot-password" style="background:none;border:none;color:var(--text-muted);font-size:0.8rem;cursor:pointer">Forgot password?</button>
      </div>

      <button class="btn-primary" id="btn-submit-auth" style="width:100%">Sign In</button>
    </form>

    <div class="auth-switch">
      <span id="switch-text">Don't have an account? </span>
      <span id="toggle-form-btn">Create one</span>
    </div>

    <div style="margin-top:1.5rem">
      <a href="index.html" style="color:var(--text-muted);font-size:0.82rem;text-decoration:none">
        ← Continue as Guest
      </a>
    </div>
  </div>
</div>

<script src="scripts/sw-manager.js" defer></script>
<script type="module">
  import {
    auth, db, provider, isAdmin,
    onAuthStateChanged,
    signInWithEmailAndPassword, createUserWithEmailAndPassword,
    sendPasswordResetEmail, updateProfile,
    doc, setDoc, getDoc, serverTimestamp
  } from "./scripts/firebase-config.js";
  import { signInWithPopup } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

  const errorBox    = document.getElementById("auth-error");
  const successBox  = document.getElementById("auth-success");
  const googleBtn   = document.getElementById("btn-google");
  const submitBtn   = document.getElementById("btn-submit-auth");
  const emailInp    = document.getElementById("email");
  const passInp     = document.getElementById("password");
  const toggleBtn   = document.getElementById("toggle-form-btn");
  const switchText  = document.getElementById("switch-text");
  const forgotBtn   = document.getElementById("btn-forgot-password");

  let isSignUp = false;

  onAuthStateChanged(auth, (user) => {
    if (user) redirect(user);
  });

  function redirect(user) {
    location.href = isAdmin(user.email) ? "admin-dashboard.html" : "index.html";
  }

  function showError(msg) {
    if (successBox) successBox.classList.remove("visible");
    errorBox.textContent = msg;
    errorBox.classList.add("visible");
  }

  function showSuccess(msg) {
    if (errorBox) errorBox.classList.remove("visible");
    successBox.textContent = msg;
    successBox.classList.add("visible");
  }

  async function ensureUserDoc(user) {
    try {
      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          uid: user.uid,
          displayName: user.displayName || user.email?.split("@")[0] || "Listener",
          email: user.email || "",
          photoURL: user.photoURL || "",
          songsPlayed: 0,
          minutesListened: 0,
          createdAt: serverTimestamp(),
          lastPlayed: null
        });
      }
    } catch (err) {
      console.warn("User doc setup:", err);
    }
  }

  // Google Sign In
  googleBtn.onclick = async () => {
    errorBox.classList.remove("visible");
    googleBtn.disabled = true;

    try {
      const result = await signInWithPopup(auth, provider);
      await ensureUserDoc(result.user);
      redirect(result.user);
    } catch (err) {
      if (err.code !== "auth/popup-closed-by-user") {
        showError(err.message || "Google sign-in failed.");
      }
    } finally {
      googleBtn.disabled = false;
    }
  };

  // Toggle Login vs Signup
  toggleBtn.onclick = () => {
    isSignUp = !isSignUp;
    submitBtn.textContent = isSignUp ? "Create Account" : "Sign In";
    toggleBtn.textContent = isSignUp ? "Sign In instead" : "Create one";
    switchText.textContent = isSignUp ? "Already have an account? " : "Don't have an account? ";
    errorBox.classList.remove("visible");
    successBox.classList.remove("visible");
  };

  // Email / Password Form Submit
  submitBtn.onclick = async () => {
    const email = emailInp.value.trim();
    const pass = passInp.value;

    if (!email || !pass) {
      showError("Please enter both email and password.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = isSignUp ? "Creating account..." : "Signing in...";

    try {
      let user;
      if (isSignUp) {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        user = cred.user;
        await updateProfile(user, { displayName: email.split("@")[0] });
        await ensureUserDoc(user);
      } else {
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        user = cred.user;
      }
      redirect(user);
    } catch (err) {
      const errorMap = {
        "auth/invalid-email": "Please enter a valid email address.",
        "auth/user-not-found": "No account found with this email.",
        "auth/wrong-password": "Incorrect password. Try again or reset.",
        "auth/email-already-in-use": "Email already in use. Please sign in.",
        "auth/weak-password": "Password must be at least 6 characters.",
        "auth/too-many-requests": "Too many failed attempts. Try again later."
      };
      showError(errorMap[err.code] || err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = isSignUp ? "Create Account" : "Sign In";
    }
  };

  // Forgot password
  forgotBtn.onclick = async () => {
    const email = emailInp.value.trim();
    if (!email) {
      showError("Please type your email address first, then click 'Forgot password?'.");
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      showSuccess(`Password reset email sent to ${email}`);
    } catch (err) {
      showError(err.message || "Failed to send reset email.");
    }
  };
</script>
</body>
</html>
